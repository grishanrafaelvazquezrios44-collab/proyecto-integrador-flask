
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
<main class="panel">
    <h1>{{ titulo }}</h1>

    <div class="scroll">
        <table>
            <tr>
                {% for h in headers %}
                <th>{{ h }}</th>
                {% endfor %}
            </tr>

            {% for row in rows %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% else %}
            <tr>
                <td colspan="{{ headers|length }}">
                    Todavía no hay registros.
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <br>
    <a href="{{ back }}">Volver al formulario</a>
    <br><br>
    <a href="/">Inicio</a>
</main>
</body>
</html>
