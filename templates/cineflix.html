
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CineFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">
        <h1>🎬 CineFlix</h1>
        <h2>Reservación de películas</h2>

        {% with mensajes = get_flashed_messages() %}
            {% for mensaje in mensajes %}
                <p>{{ mensaje }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="text" name="pelicula" placeholder="Película" required>
            <input type="date" name="fecha" required>
            <input type="text" name="horario" placeholder="Horario" required>
            <input type="number" name="boletos" placeholder="Número de boletos" min="1" max="10" required>
            <input type="text" name="sala" placeholder="Sala" required>

            <button type="submit">Reservar</button>
        </form>

        <a href="/cineflix/respuestas">Ver reservaciones</a>
        <br><a href="/">Volver al inicio</a>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
