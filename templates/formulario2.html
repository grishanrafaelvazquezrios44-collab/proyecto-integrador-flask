
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buzón de sugerencias</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
<main class="panel">
    <h1>💡 Buzón de sugerencias</h1>
    <p>Ayúdanos a mejorar CineFlix.</p>

    <form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <label>Categoría:</label>
        <select name="categoria" required>
            <option value="">Selecciona</option>
            <option>Servicio</option>
            <option>Diseño</option>
            <option>Contenido</option>
            <option>Otro</option>
        </select>

        <label>Escribe tu sugerencia:</label>
        <textarea name="sugerencia" required></textarea>

        <button type="submit">Enviar sugerencia</button>
    </form>

    {% with ms = get_flashed_messages(with_categories=true) %}
        {% for tipo, mensaje in ms %}
            <p class="{{ tipo }}">{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}

    <a href="/formulario2/respuestas">Ver sugerencias</a>
    <br><br>
    <a href="/">Volver al inicio</a>
</main>
</body>
</html>
